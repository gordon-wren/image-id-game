name: Build aircraft dataset

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-181wy8]
    paths:
      - scripts/aircraft-dataset/seed.json
      - scripts/aircraft-dataset/build.mjs
      - .github/workflows/aircraft-dataset.yml

permissions:
  contents: write

concurrency:
  group: aircraft-dataset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/aircraft-dataset/build.mjs
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/data public/assets/aircraft scripts/aircraft-dataset/REPORT.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild aircraft dataset from Wikipedia"
          git push
