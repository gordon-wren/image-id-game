name: Fetch Commons photos

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, gh-pages]
    paths:
      - scripts/commons-photos/manifest.json
      - scripts/commons-photos/fetch.mjs
      - .github/workflows/commons-photos.yml

permissions:
  contents: write

concurrency:
  group: commons-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/commons-photos/fetch.mjs ${{ hashFiles('scripts/commons-photos/PREVIEWS') != '' && '--previews' || '' }}
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets scripts/commons-photos
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fetch Commons photos"
          git push
